name: Deploy to Wasmer Edge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql

      - name: Install PHP dependencies (Composer)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets (Vite)
        run: npm run build

      - name: Setup Wasmer CLI
        uses: wasmerio/setup-wasmer@v3
        with:
          token: ${{ secrets.WASMER_TOKEN }}

      - name: Deploy to Wasmer Edge
        run: wasmer deploy --non-interactive --owner charlesevangeliojr --token ${{ secrets.WASMER_TOKEN }}
